[project]
name = "llm-from-scratch-notebook"
version = "0.1.0"
description = "Educational notebooks implementing a vanilla Transformer and a tiny Kimi K3-inspired language model"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "regex>=2023.10.3",
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1.0",
    "matplotlib>=3.7",
]
